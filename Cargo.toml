# =============================================================================
# DataForge — Cargo Workspace Root
# =============================================================================
# This is the root workspace manifest for the DataForge project.
# It defines all member crates and shared dependency versions to ensure
# consistency across the entire project.
#
# Member crates:
#   - dataforge-core:   Pure Rust core library (streaming parsers, transforms)
#   - dataforge-ffi:    C ABI foreign function interface for cross-language use
#   - dataforge-node:   Node.js bindings via napi-rs
#   - dataforge-python: Python bindings via PyO3
#   - dataforge-wasm:   WebAssembly bindings via wasm-bindgen
# =============================================================================

[workspace]
resolver = "2"
members = [
    "crates/dataforge-core",
    "crates/dataforge-ffi",
    "crates/dataforge-node",
    "crates/dataforge-python",
    "crates/dataforge-wasm",
]

# ---------------------------------------------------------------------------
# Shared dependency versions (workspace inheritance)
# All crates should use `dep.workspace = true` to inherit these versions,
# ensuring we don't end up with version conflicts across the workspace.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# CSV parsing — high-performance, RFC 4180 compliant
csv = "1"

# XML parsing — SAX-style streaming, no DOM allocation
quick-xml = "0.37"

# ZIP archive I/O — for XLSX/ODS (which are ZIP-based formats)
zip = { version = "2", default-features = false, features = ["deflate-zlib-ng"] }

# Memory-mapped file I/O — lets the OS manage paging for large files
memmap2 = "0.9"

# SIMD-accelerated byte scanning — fast newline/delimiter detection
memchr = "2"

# Data parallelism — work-stealing thread pool
rayon = "1"

# Lock-free concurrent channels — producer/consumer patterns
crossbeam-channel = "0.5"

# Stack-allocated small vectors — avoids heap for small row data
smallvec = { version = "1", features = ["union", "write", "const_generics", "serde"] }

# Compact string — small-string optimization (SSO), 24 bytes inline
compact_str = { version = "0.8", features = ["serde"] }

# Date/time types
chrono = { version = "0.4", features = ["serde"] }

# Character encoding detection & conversion
encoding_rs = "0.8"

# Structured logging / diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Regular expressions
regex = "1"

# High-performance memory allocator — reduced fragmentation
mimalloc = { version = "0.1", default-features = false }

# Benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Testing utilities
tempfile = "3"

# Number parsing — fast float/int parsing
lexical-core = "1"

# Apache Arrow support
arrow = { version = "53", features = ["ipc"] }

# Encryption & Compound File Binary (CFB) for ECMA-376 decryption
cfb = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
base64 = "0.22"

# ---------------------------------------------------------------------------
# Workspace-wide profile settings
# ---------------------------------------------------------------------------
[profile.release]
lto = "fat"           # Full link-time optimization for maximum performance
codegen-units = 1     # Single codegen unit for better optimization
opt-level = 3         # Maximum optimization level
strip = "symbols"     # Strip debug symbols from release binaries
panic = "abort"       # Abort on panic (no unwinding overhead)

[profile.bench]
lto = "thin"          # Thin LTO for faster benchmark builds
codegen-units = 4     # Balance between speed and optimization

[profile.dev]
opt-level = 0         # No optimization in dev for fast compilation
debug = true          # Full debug info
