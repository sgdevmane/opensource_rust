[package]
name = "dataforge-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for DataForge"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dataforge-core = { path = "../dataforge-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen-rayon = "1.2"
